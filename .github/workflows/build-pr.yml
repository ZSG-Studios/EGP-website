name: EGP website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: egp-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _layouts
            _sass
            assets/css
            assets/fonts
            assets/icons
            egp_pages
            egp_plugins
            egp_data
            tools
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build EGP with upstream Jekyll styles
        run: bundle exec jekyll build --config _config.yml,_config.egp.yml --strict_front_matter
      - name: Check local links, assets and branding
        run: python tools/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: egp-website-html
          path: _site
