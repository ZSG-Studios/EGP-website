name: Publish EGP website
on: [workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: egp-site-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _layouts
            _sass
            assets/css
            assets/fonts
            assets/icons
            egp_pages
            egp_plugins
            egp_data
            tools
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --config _config.yml,_config.egp.yml --strict_front_matter
      - run: python tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
